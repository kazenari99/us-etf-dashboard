name: Publish US ETF dashboard
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      stocks_only:
        description: 'Refresh stocks independently, preserving the last published ETF snapshot'
        type: boolean
        default: false
      use_committed_snapshot:
        description: 'Publish an explicitly imported, validated local snapshot'
        type: boolean
        default: false
  schedule:
    # 07:00 Asia/Tokyo on the next calendar date; NYSE holiday gate below.
    - cron: '0 22 * * *'
    # A separate later ETF attempt at 15:00 Tokyo, after overnight Yahoo corrections.
    - cron: '0 6 * * *'
    # One hour after each upstream VCPScanner scheduled refresh.
    - cron: '17 21 * * 1-5'
      timezone: America/New_York
    - cron: '17 23 * * 1-5'
      timezone: America/New_York
permissions:
  contents: read
  actions: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  calendar:
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.calendar.outputs.run }}
      stocks_only: ${{ steps.calendar.outputs.stocks_only }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip
      - run: pip install -r requirements.txt
      - name: Check previous Tokyo date against NYSE calendar
        id: calendar
        env:
          REFRESH_SCHEDULE: ${{ github.event.schedule }}
          STOCKS_ONLY: ${{ inputs.stocks_only }}
        run: python scripts/check_refresh_day.py
  deploy:
    needs: calendar
    if: ${{ needs.calendar.outputs.run == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    outputs:
      etf_published: ${{ steps.etf.outputs.published }}
      etf_asof: ${{ steps.etf.outputs.asof }}
    environment:
      name: github-pages
      url: ${{ steps.deploy_retry.outputs.page_url || steps.deploy_first.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip
      - run: pip install -r requirements.txt
      - name: Test calendar and data integrity
        run: python -m unittest discover -s tests -v
      - name: Restore latest published data before independent refresh
        id: restore
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          STOCKS_ONLY: ${{ needs.calendar.outputs.stocks_only }}
          KEEP_COMMITTED_ETF: ${{ inputs.use_committed_snapshot && 'true' || 'false' }}
        run: python scripts/restore_published_data.py
      - name: Refresh complete US ETF universe
        id: etf
        if: ${{ needs.calendar.outputs.stocks_only != 'true' && !inputs.use_committed_snapshot }}
        run: python scripts/refresh_snapshot.py
      - name: Check imported snapshot freshness
        if: ${{ needs.calendar.outputs.stocks_only != 'true' && inputs.use_committed_snapshot }}
        run: |
          python -c "import sys,json;sys.path.insert(0,'scripts');from refresh_snapshot import completed_sessions; a=json.load(open('dist/snapshot_meta.json'))['asof']; latest=str(completed_sessions()[-1].date()); sys.exit(0 if a==latest else 'Imported snapshot is stale: '+a+' < '+latest)"
      - name: Validate JavaScript and snapshot
        env:
          # Never publish an ETF session older than the one already live.
          MIN_ASOF: ${{ steps.restore.outputs.asof }}
        run: |
          node --check dist/app.js
          node --check dist/i18n.js
          node --check dist/fund-context.js
          node --check dist/stocks.js
          python scripts/validate_snapshot.py
      - name: Align stock status with the published ETF session
        run: python scripts/restore_published_data.py --reconcile-only
      - name: Refresh public stock candidates with explicit source date
        if: ${{ needs.calendar.outputs.stocks_only == 'true' }}
        run: python scripts/refresh_stocks.py
      - name: Refresh stock sector classifications
        if: ${{ needs.calendar.outputs.stocks_only == 'true' }}
        run: python scripts/refresh_stock_sectors.py
      - name: Refresh public fund profiles and holdings
        if: ${{ needs.calendar.outputs.stocks_only != 'true' }}
        run: python scripts/refresh_funds.py
      - uses: actions/upload-artifact@v6
        if: ${{ needs.calendar.outputs.stocks_only != 'true' && !inputs.use_committed_snapshot }}
        with:
          name: us-etf-research-${{ github.run_id }}
          path: archive/
          retention-days: 90
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist
          retention-days: 14
      # The artifact listing API is eventually consistent: deploy-pages can report
      # "No artifacts named github-pages" seconds after a successful upload.
      - name: Deploy
        id: deploy_first
        continue-on-error: true
        uses: actions/deploy-pages@v5
      - name: Wait before retrying Pages deployment
        if: ${{ steps.deploy_first.outcome == 'failure' }}
        run: |
          echo "::warning title=Pages deploy retry::First deploy attempt failed; retrying in 60s"
          sleep 60
      - name: Retry Pages deployment
        id: deploy_retry
        if: ${{ steps.deploy_first.outcome == 'failure' }}
        uses: actions/deploy-pages@v5
  history:
    # Keep every published ETF session on the `data` branch; artifacts expire after 90 days.
    needs: deploy
    if: ${{ needs.deploy.outputs.etf_published == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v6
      - name: Download this run's ETF snapshot
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh run download "${{ github.run_id }}" --repo "${{ github.repository }}" --name "us-etf-research-${{ github.run_id }}" --dir research
      - name: Check out data branch
        run: |
          if git fetch --depth=1 origin data; then
            git worktree add -B data history FETCH_HEAD
          else
            git worktree add --orphan -b data history
          fi
      - name: Record session
        run: python scripts/record_history.py research history
      - name: Push history
        env:
          ASOF: ${{ needs.deploy.outputs.etf_asof }}
        run: |
          cd history
          git add -A
          if git diff --cached --quiet; then echo 'History already up to date'; exit 0; fi
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
            commit -q -m "ETF snapshot $ASOF (run ${{ github.run_id }})"
          git push origin data
