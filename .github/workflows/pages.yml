name: Publish US ETF dashboard
on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '37 23 * * 1-5'
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: pip install -r requirements.txt
      - name: Test calendar and data integrity
        run: python -m unittest discover -s tests -v
      - name: Refresh complete US ETF universe
        run: python scripts/refresh_snapshot.py
      - name: Validate JavaScript and snapshot
        run: |
          node --check dist/app.js
          python scripts/validate_snapshot.py
      - uses: actions/upload-artifact@v4
        with:
          name: us-etf-research-${{ github.run_id }}
          path: archive/
          retention-days: 90
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
