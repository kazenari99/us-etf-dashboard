<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="美国上市 ETF 20/60/120 日动量扫描与交易计划仪表盘" />
  <title>美股 ETF 动量雷达</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23090f1c'/%3E%3Cpath d='M6 23l6-7 5 3 9-11' fill='none' stroke='%236ee7b7' stroke-width='3' stroke-linecap='round' stroke-linejoin='round'/%3E%3Ccircle cx='26' cy='8' r='2.5' fill='%23fbbf24'/%3E%3C/svg%3E" />
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <div class="page-shell">
    <header class="topbar">
      <div class="brand">
        <div class="brand-mark" aria-hidden="true"><span></span><span></span><span></span></div>
        <div>
          <p class="eyebrow">HERMES / US MARKET RESEARCH</p>
          <h1>美股 ETF 动量雷达</h1>
        </div>
      </div>
      <div class="asof"><span class="live-dot"></span><span id="asOf">载入数据中</span></div>
    </header>

    <main>
      <section class="control-row" aria-label="筛选工具">
        <label class="search-box">
          <span aria-hidden="true">⌕</span>
          <input id="searchInput" type="search" placeholder="搜索代码或名称，如 CIBR、网络安全…" autocomplete="off" />
        </label>
        <label class="select-wrap">
          <span>资产组</span>
          <select id="groupSelect"><option value="all">全部资产组</option></select>
        </label>
        <div class="segmented" id="setupFilter" aria-label="交易状态筛选">
          <button type="button" data-setup="all" class="active">全部</button>
          <button type="button" data-setup="actionable">可交易</button>
          <button type="button" data-setup="watch">等待确认</button>
          <button type="button" data-setup="avoid">趋势破坏</button>
        </div>
      </section>

      <section class="kpi-grid" id="kpiGrid" aria-label="市场宽度概览"></section>

      <section class="market-strip">
        <div>
          <p class="section-kicker">REGIME</p>
          <h2>长趋势仍在，短线动量收缩</h2>
          <p id="regimeCopy">正在分析市场宽度…</p>
        </div>
        <div class="breadth" id="breadthBars" aria-label="上涨比例"></div>
      </section>

      <section class="dashboard-grid">
        <article class="panel scatter-panel">
          <div class="panel-head">
            <div><p class="section-kicker">MOMENTUM MAP</p><h2>20日 × 60日动量象限</h2></div>
            <div class="legend"><span><i class="cool"></i>120日弱</span><span><i class="hot"></i>120日强</span></div>
          </div>
          <div class="chart-wrap" id="scatterChart" role="img" aria-label="ETF 20日和60日收益散点图"></div>
          <p class="chart-note">右上角代表短中期同步上涨；圆点越大，20日平均成交额越高。点击圆点查看交易参数。</p>
        </article>

        <article class="panel leader-panel">
          <div class="panel-head">
            <div><p class="section-kicker">LEADERS</p><h2>综合动量排名</h2></div>
            <span class="badge">20/60/120D</span>
          </div>
          <div class="leader-list" id="leaderList"></div>
        </article>
      </section>

      <section class="opportunity-section">
        <div class="section-title-row">
          <div><p class="section-kicker">TRADE SETUPS</p><h2>当前交易机会</h2></div>
          <p>回踩优先，突破确认；过热品种等待均值回归。</p>
        </div>
        <div class="opportunity-grid" id="opportunityGrid"></div>
      </section>

      <section class="table-section">
        <div class="section-title-row">
          <div><p class="section-kicker">FULL UNIVERSE</p><h2>ETF 扫描明细</h2></div>
          <p id="resultCount"></p>
        </div>
        <div class="table-wrap">
          <table>
            <thead><tr>
              <th data-sort="ticker">代码</th><th data-sort="group">资产组</th>
              <th data-sort="close" class="num">收盘</th><th data-sort="r20" class="num">20日</th>
              <th data-sort="r60" class="num">60日</th><th data-sort="r120" class="num">120日</th>
              <th data-sort="rs60" class="num">相对SPY</th><th data-sort="atr_pct" class="num">ATR%</th>
              <th data-sort="score" class="num">评分</th><th data-sort="setup">状态</th>
            </tr></thead>
            <tbody id="tableBody"></tbody>
          </table>
        </div>
      </section>
    </main>
  </div>

  <aside class="detail-drawer" id="detailDrawer" aria-hidden="true">
    <button class="drawer-close" id="drawerClose" aria-label="关闭详情">×</button>
    <div id="drawerContent"></div>
  </aside>
  <div class="drawer-backdrop" id="drawerBackdrop"></div>
  <div class="tooltip" id="tooltip" role="status"></div>
  <script src="./app.js"></script>
</body>
</html>
