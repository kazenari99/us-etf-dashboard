name = "us-etf-scheduler"
main = "src/index.js"
compatibility_date = "2025-06-01"

# Cloudflare cron triggers are UTC and fire on time, unlike GitHub's schedule.
# 06:00 and 22:00 UTC are the ETF runs; 01:17–04:17 UTC covers 21:17 and 23:17
# New York time in both EDT and EST — src/index.js picks the matching hour.
[triggers]
crons = ["0 6,22 * * *", "17 1-4 * * *"]

[vars]
GH_REPO = "kazenari99/us-etf-dashboard"
WORKFLOW = "pages.yml"
